# mcz-bridge derrière Traefik (HTTPS, nom de domaine). Traefik doit déjà tourner, avec un fournisseur Docker et un réseau partagé
# (TRAEFIK_NETWORK, défaut `proxy`). Lancement : docker compose -f docker-compose.traefik.yml up -d --build. Voir docs/installation.md.
services:
  mcz-bridge:
    build: .
    image: mcz-bridge:latest
    pull_policy: build   # toujours reconstruire depuis le dépôt (l'image n'est publiée sur aucun registre)
    container_name: mcz-bridge
    restart: unless-stopped
    environment:
      MCZ_USER: ${MCZ_USER:?MCZ_USER manquant (e-mail du compte Maestro+)}
      MCZ_PASSWORD: ${MCZ_PASSWORD:-}
      MCZ_PASSWORD_B64: ${MCZ_PASSWORD_B64:-}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?BRIDGE_TOKEN manquant (openssl rand -hex 32)}
      POLL_SECONDS: "5"
      DB_PATH: /srv/data/history.sqlite
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      PELLET_CAPACITY_KG: ${PELLET_CAPACITY_KG:-16}
      WEATHER_LAT: ${WEATHER_LAT:-}
      WEATHER_LON: ${WEATHER_LON:-}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      WEB_PASSWORD_B64: ${WEB_PASSWORD_B64:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-https://${BRIDGE_HOST}}
    volumes:
      - mcz-data:/srv/data   # historique, plages, réglages, clé des notifications : à sauvegarder
    ports:
      # Accès local pour le pont HomeKit (homekit/), sans repasser par Internet ni par un portail d'authentification.
      - "127.0.0.1:8001:8000"
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.mcz.rule=Host(`${BRIDGE_HOST:?BRIDGE_HOST manquant (ex. poele.example.com)}`)
      - traefik.http.routers.mcz.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.mcz.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.mcz.loadbalancer.server.port=8000

volumes:
  mcz-data:

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
